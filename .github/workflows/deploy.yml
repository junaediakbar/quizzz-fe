name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

      # Standalone output doesn't include static assets; copy them in.
      - name: Package
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          tar -czf fe.tgz -C .next/standalone .

      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: fe.tgz
          target: /tmp

      - name: Swap release and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # One-time VPS setup; every step is idempotent.
            NODE_MAJOR=$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo 0)
            if [ "$NODE_MAJOR" -lt 20 ]; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
              apt-get install -y nodejs
            fi
            id quizzz >/dev/null 2>&1 || useradd --system --no-create-home --shell /usr/sbin/nologin quizzz
            if ss -tln | grep -q ':3000 ' && ! systemctl is-active -q quizzz-frontend; then
              echo "Port 3000 is used by another process"; exit 1
            fi
            mkdir -p /opt/quizzz-fe
            cat > /etc/systemd/system/quizzz-frontend.service <<'EOF'
            [Unit]
            Description=Quizzz Frontend (Next.js)
            After=network.target

            [Service]
            User=quizzz
            WorkingDirectory=/opt/quizzz-fe/app
            Environment=NODE_ENV=production PORT=3000 HOSTNAME=127.0.0.1
            ExecStart=/usr/bin/node server.js
            Restart=always

            [Install]
            WantedBy=multi-user.target
            EOF
            systemctl daemon-reload
            systemctl enable -q quizzz-frontend
            # exampro.ai.id is routed by Caddy (/etc/caddy/Caddyfile) to :3000.

            cd /opt/quizzz-fe
            rm -rf new old
            mkdir new
            tar -xzf /tmp/fe.tgz -C new
            rm /tmp/fe.tgz
            chown -R quizzz:quizzz new
            [ -d app ] && mv app old
            mv new app
            systemctl restart quizzz-frontend
            sleep 3
            systemctl is-active quizzz-frontend
            curl -fsS -o /dev/null http://127.0.0.1:3000
