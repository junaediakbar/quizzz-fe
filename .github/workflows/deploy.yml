name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull, build, and reload on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/quizzz-fe
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            chown -R quizzz:quizzz /opt/quizzz-fe
            systemctl restart quizzz-frontend
            sleep 3
            systemctl is-active quizzz-frontend
            curl -fsS -o /dev/null http://127.0.0.1:3000
